[project]
name = "mach-symbols-upload"
version = "20251130.0"
description = "Upload debug symbols for Mozilla applications on NixOS channels to symbols.mozilla.org"
authors = [{ name = "Martin Weinelt", email = "hexa@darmstadt.ccc.de" }]
requires-python = ">=3.13,<4"
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "aiohttp>=3.8.1,<4",
    "appdirs>=1.4.4,<2",
    "click>=8.1.3,<9",
    "structlog>=21.5.0,<22",
    "tenacity>=9.1.4,<10",
]

[project.scripts]
mach-symbols-upload = "mach_symbols_upload.__main__:main"

[dependency-groups]
dev = [
    "types-appdirs>=1.4.2,<2",
]

[build-system]
requires = ["uv_build>=0.10.12,<0.11.0"]
build-backend = "uv_build"
